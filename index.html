<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loko2K Store Hub</title>
    <style>
        body { 
            background-color: #020204; 
            color: #ffffff; 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; 
            padding-bottom: 30px;
            overflow-x: hidden;
        }
        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 85, 0.02), rgba(0, 255, 102, 0.01), rgba(0, 229, 255, 0.02));
            z-index: 99999; background-size: 100% 4px, 4px 100%; pointer-events: none;
        }
        .store-header {
            padding: 20px 15px;
            background: #050508;
            border-bottom: 1px solid #111;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .store-title { font-size: 24px; font-weight: 900; color: #00ff66; text-shadow: 0 0 10px rgba(0,255,102,0.3); }
        .store-subtitle { font-size: 10px; color: #ff0055; letter-spacing: 1px; margin-top: 3px; }
        .app-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 15px;
        }
        .app-card { 
            background: #050508; 
            padding: 12px; 
            border-radius: 8px; 
            position: relative;
            border: 1px solid rgba(255, 0, 85, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .app-card::before {
            content: ''; position: absolute; top: -1px; left: -1px; width: 12px; height: 12px;
            border-top: 2px solid #ff0055; border-left: 2px solid #ff0055;
        }
        .app-thumbnail { 
            width: 100%; 
            height: 110px; 
            border-radius: 6px; 
            object-fit: cover; 
            border: 1px solid #00e5ff;
            margin-bottom: 8px;
        }
        .app-title { font-size: 13px; font-weight: 900; color: #ffffff; line-height: 1.2; height: 32px; overflow: hidden; }
        .key-badge { font-size: 8px; background: rgba(255,0,85,0.1); color: #ff0055; padding: 3px 6px; border-radius: 3px; border: 1px dashed #ff0055; display: inline-block; margin-bottom: 8px; text-transform: uppercase; }
        .btn-dl { 
            width: 100%; color: #fff; border: none; padding: 10px 0; border-radius: 4px; 
            font-weight: 900; cursor: pointer; font-size: 11px; letter-spacing: 1px; 
            font-family: monospace; text-transform: uppercase; margin-top: 4px;
        }
        .btn-apk { background: #ff0055; box-shadow: 0 0 10px rgba(255,0,85,0.3); }
        .btn-obb { background: #00e5ff; color: #000; box-shadow: 0 0 10px rgba(0,229,255,0.3); }
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #010102; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 9999; 
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #loading-overlay.active { opacity: 1; pointer-events: auto; }
        .radar-hub { position: relative; width: 80px; height: 80px; }
        .radar-sweep { position: absolute; width: 100%; height: 100%; border: 2px solid transparent; border-top-color: #00ff66; border-left-color: #00ff66; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #auth-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #020203; display: flex; justify-content: center; align-items: center; z-index: 9990; padding: 20px;
        }
        .auth-box { background: #050508; border: 1px solid #ff0055; padding: 30px 20px; border-radius: 8px; width: 100%; max-width: 280px; text-align: center; }
        .btn-auth { width: 100%; background: #00ff66; color: black; font-weight: 900; padding: 12px; border: none; font-family: monospace; cursor: pointer; letter-spacing: 1px; margin-top: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <script>
        function initAccess() {
            const overlay = document.getElementById('loading-overlay');
            overlay.classList.add('active');
            setTimeout(() => {
                overlay.classList.remove('active');
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
            }, 1200);
        }
        function triggerDownload(url) {
            const overlay = document.getElementById('loading-overlay');
            overlay.classList.add('active');
            window.location.href = url;
            setTimeout(() => { overlay.classList.remove('active'); }, 2500);
        }
    </script>
